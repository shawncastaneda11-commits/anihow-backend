[program:anihow-staging-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/anihow-staging/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/anihow-staging
user=anihow
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/anihow-staging/storage/logs/queue.log

[program:anihow-staging-reverb]
command=php /var/www/anihow-staging/artisan reverb:start --host=127.0.0.1 --port=8081
directory=/var/www/anihow-staging
user=anihow
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/anihow-staging/storage/logs/reverb.log
